[workspace]
resolver = "3"
members = ["crates/ntfs", "crates/index", "crates/query", "crates/engine", "crates/pipe", "crates/service", "crates/cli", "crates/ui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Size-optimized build for shipping; the default release profile favors speed for benchmarking.
[profile.release-small]
inherits = "release"
opt-level = "z"
