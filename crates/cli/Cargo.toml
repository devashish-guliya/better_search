[package]
name = "bs-cli"
description = "Command-line prototype: index drives and search from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bs"
path = "src/main.rs"

[dependencies]
bs-index = { version = "0.1.0", path = "../index" }
bs-ntfs = { version = "0.1.0", path = "../ntfs" }
bs-query = { version = "0.1.0", path = "../query" }
rayon = "1.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
