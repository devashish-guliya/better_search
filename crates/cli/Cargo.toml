[package]
name = "bs-cli"
description = "Command-line prototype: index drives and search from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bs"
path = "src/main.rs"

[dependencies]
bs-engine = { version = "0.2.5", path = "../engine" }
bs-index = { version = "0.2.5", path = "../index" }
bs-pipe = { version = "0.2.5", path = "../pipe" }
bs-query = { version = "0.2.5", path = "../query" }
rayon = "1.12.0"
