[package]
name = "bs-service"
description = "Windows service that keeps the index live and answers searches over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bs-service"
path = "src/main.rs"

[dependencies]
bs-engine = { version = "0.2.4", path = "../engine" }
bs-index = { version = "0.2.4", path = "../index" }
bs-pipe = { version = "0.2.4", path = "../pipe" }
bs-query = { version = "0.2.4", path = "../query" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
