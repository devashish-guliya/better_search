[package]
name = "better-search-setup"
version = "0.2.6"
edition = "2024"
publish = false

# Built separately, after the three release binaries. The packaging step embeds
# them in one distributable exe; it never writes to the machine during the build.
# `tools/release.ps1` keeps this version in step with the workspace, because it is the
# version Apps & Features shows for the installed copy.
[workspace]

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
